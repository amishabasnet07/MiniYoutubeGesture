<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MiniYouTube</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #121212;
      color: #fff;
    }
    .videos {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      padding: 20px;
    }
    .video-card {
      background: #181818;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      transition: transform 0.3s;
    }
    .video-card:hover {
      transform: scale(1.03);
    }
    .video-card img {
      width: 100%;
      height: 150px;
      object-fit: contain;
      border-radius: 4px;
    }
    #input_video {
      display: none;
    }
  </style>
</head>
<body>
  <h1 style="padding: 20px;">MiniYouTube</h1>
  <section class="videos">
    {% for song in songs %}
    <div class="video-card" onclick="location.href='/play/{{ song.id }}'">
      <img src="{{ url_for('static', filename='images/' + (song.image or 'default.jpg')) }}" alt="{{ song.title }}">
      <h3>{{ song.title }}</h3>
      <p>{{ song.artist }}</p>
    </div>
    {% endfor %}
  </section>

  <video id="input_video" playsinline></video>

  <!-- Only Scroll Left/Right using Left Index Finger -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script>
    let lastX = null;
    let scrollVelocity = 0;

    function isIndexOnly(landmarks) {
      const index = landmarks[8].y < landmarks[6].y;
      const others = [12, 16, 20].every(i => landmarks[i].y > landmarks[i - 2].y);
      return index && others;
    }

    function handleLeftScroll(landmarks) {
      if (!isIndexOnly(landmarks)) return;
      const currX = landmarks[8].x;
      if (lastX !== null) {
        let deltaX = currX - lastX;
        window.scrollBy(0, -deltaX * 1000);
      }
      lastX = currX;
    }

    const hands = new Hands({ locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });
    hands.onResults(res => {
      if (res.multiHandLandmarks && res.multiHandedness[0].label === "Left") {
        handleLeftScroll(res.multiHandLandmarks[0]);
      }
    });

    const camera = new Camera(document.getElementById('input_video'), {
      onFrame: async () => await hands.send({ image: document.getElementById('input_video') }),
      width: 640, height: 480
    });
    camera.start();
  </script>
</body>
</html>
